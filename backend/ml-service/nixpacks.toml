# The service runs no models locally — it calls the LLM provider HTTP APIs.
# It therefore needs no ffmpeg (audio decoding), no openai-whisper, and no
# setuptools pin (that constraint existed only to build the whisper wheel).

[phases.setup]
nixPkgs = ["python310"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && python -m pip install -U pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]
